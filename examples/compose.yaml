# 运行示例：使用构建工具输出的镜像引用，不在 Compose 中构建或修改 tag。
services:
  ascend:
    image: ${ASCEND_IMAGE:?set ASCEND_IMAGE to the generated image reference}
    pull_policy: never
    user: "${LOCAL_UID:?set LOCAL_UID}:${LOCAL_GID:?set LOCAL_GID}"
    working_dir: /workspace/code
    command: ["sleep", "infinity"]
    environment:
      HOME: /workspace/home
      XDG_CACHE_HOME: /workspace/home/.cache
    volumes:
      - type: bind
        source: ${CODE_DIR:?set CODE_DIR to an existing absolute path}
        target: /workspace/code
        bind:
          create_host_path: false
      - type: bind
        source: ${DEV_HOME:?set DEV_HOME to an existing writable absolute path}
        target: /workspace/home
        bind:
          create_host_path: false
      # Generated from this image's accounts by prepare-user.sh, not host /etc.
      - type: bind
        source: ${IDENTITY_DIR:?run prepare-user.sh first}/passwd
        target: /etc/passwd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IDENTITY_DIR:?run prepare-user.sh first}/group
        target: /etc/group
        read_only: true
        bind:
          create_host_path: false
