# 与 compose.yaml 合并使用；设备及驱动路径沿用参考资料，须按实际服务器调整。
services:
  ascend:
    devices:
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/hisi_hdc:/dev/hisi_hdc
    group_add:
      - "${NPU_DEVICE_GID:?set the group ID of /dev/davinci0}"
      - "${NPU_MANAGER_GID:?set the group ID of /dev/davinci_manager}"
      - "${NPU_HDC_GID:?set the group ID of /dev/hisi_hdc}"
    volumes:
      - type: bind
        source: /usr/local/dcmi
        target: /usr/local/dcmi
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /usr/local/Ascend/driver/lib64
        target: /usr/local/Ascend/driver/lib64
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /usr/local/Ascend/driver/version.info
        target: /usr/local/Ascend/driver/version.info
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/ascend_install.info
        target: /etc/ascend_install.info
        read_only: true
        bind:
          create_host_path: false
